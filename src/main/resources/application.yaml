spring:
  application:
    name: aureus

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/aureus}
    username: ${DB_USERNAME:aureus}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
